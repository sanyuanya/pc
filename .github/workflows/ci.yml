name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and project deps
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip sync --system uv.lock
          uv pip install --system -e .
          uv pip install --system pytest

      - name: Verify bytecode compilation
        run: uv run python -m compileall main.py pc

      - name: Run pytest when tests exist
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then
            uv run python -m pytest -q
          else
            echo "No pytest files detected, skipping."
          fi

  docker:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_REPO: ${{ secrets.GHCR_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_REPO != '' }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: ${{ env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' && env.GHCR_REPO != '' }}
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/bake-action@v5
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_REPO != '' && env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' && env.GHCR_REPO != '' }}
        with:
          files: docker-bake.hcl
          push: true
          set: |
            pc.tags=${{ env.DOCKERHUB_REPO }}:latest
            pc.tags+=${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
            pc.tags+=ghcr.io/${{ env.GHCR_REPO }}:latest
            pc.tags+=ghcr.io/${{ env.GHCR_REPO }}:${{ github.sha }}
