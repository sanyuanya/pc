[project]
name = "pc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.3",
    "playwright>=1.44.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "wordcloud>=1.9.3",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["pc*"]
exclude = ["static", "templates", "tests", "data"]
