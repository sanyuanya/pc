<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ _("title") }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}" />
  </head>
  <body>
    <!-- SVG Sprite -->
    <svg style="display: none;">
      <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </symbol>
      <symbol id="icon-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </symbol>
      <symbol id="icon-lang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <circle cx="12" cy="12" r="10"></circle>
         <line x1="2" y1="12" x2="22" y2="12"></line>
         <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
        <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a6 6 0 0 1 6-6h12"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a6 6 0 0 1-6 6H3"></path>
      </symbol>
      <symbol id="icon-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <polyline points="23 20 23 14 17 14"></polyline>
        <path d="M20.49 9a9 9 0 0 0-15.73-3.36L1 10m22 4-3.76 4.36A9 9 0 0 1 3.51 15"></path>
      </symbol>
    </svg>

    <div class="container">
      <header class="header-row">
        <div class="brand">
          <h1>{{ _("title") }}</h1>
          <span>{{ _("subtitle") }}</span>
        </div>
        
        <button id="menu-toggle" class="btn btn-secondary mobile-only" aria-label="Menu">
          <svg class="icon"><use href="#icon-menu"></use></svg>
        </button>

        <div class="actions" id="nav-actions">
           <a href="/set-lang/{% if lang == 'zh' %}en{% else %}zh{% endif %}" class="btn btn-secondary" aria-label="Switch Language">
            <svg class="icon"><use href="#icon-lang"></use></svg>
            <span class="btn-text">{{ _("lang_switch") }}</span>
          </a>
          <button id="theme-toggle" class="btn btn-secondary" aria-label="{{ _('theme_dark') }}">
            <svg class="icon"><use href="#icon-moon"></use></svg>
            <span class="btn-text">{{ _("theme_dark") }}</span>
          </button>
          {% if current_user %}
          <div class="user-info btn btn-secondary" style="cursor: default;">
            <svg class="icon"><use href="#icon-user"></use></svg>
            <span class="truncate" style="max-width: 100px;">{{ current_user.username }}</span>
          </div>
          <a href="/settings/auth" class="btn btn-secondary">
            <svg class="icon"><use href="#icon-upload"></use></svg>
            <span class="btn-text">{{ _("nav_auth_settings") }}</span>
          </a>
          <form method="post" action="/logout" class="inline-form">
            <button type="submit" class="btn btn-danger-soft">
              <svg class="icon"><use href="#icon-refresh"></use></svg>
              <span class="btn-text">{{ _("nav_logout") }}</span>
            </button>
          </form>
          {% else %}
          <a href="/login" class="btn btn-primary">
            <svg class="icon"><use href="#icon-user"></use></svg>
            <span class="btn-text">{{ _("nav_login") }}</span>
          </a>
          {% endif %}
        </div>
      </header>

      {% block content %}{% endblock %}
    </div>

    <script>
      (function() {
        const root = document.documentElement;
        
        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) {
          const themeIconUse = themeBtn.querySelector('use');
          const themeBtnText = themeBtn.querySelector('.btn-text');
          const TEXT_LIGHT = '{{ _("theme_light") }}';
          const TEXT_DARK = '{{ _("theme_dark") }}';

          function setTheme(mode) {
            root.dataset.theme = mode;
            try {
              localStorage.setItem('theme', mode);
            } catch (err) {
              document.cookie = `theme=${mode};path=/;max-age=31536000`;
            }
            if (mode === 'dark') {
              themeIconUse.setAttribute('href', '#icon-sun');
              themeBtnText.textContent = TEXT_LIGHT;
            } else {
              themeIconUse.setAttribute('href', '#icon-moon');
              themeBtnText.textContent = TEXT_DARK;
            }
          }

          function readTheme() {
            const fallback = root.dataset.theme || 'dark';
            try {
              return localStorage.getItem('theme') || fallback;
            } catch (err) {
              const match = document.cookie.match(/theme=([^;]+)/);
              return match ? match[1] : fallback;
            }
          }

          setTheme(readTheme());
          themeBtn.addEventListener('click', () => {
            const current = root.dataset.theme === 'dark' ? 'dark' : 'light';
            setTheme(current === 'dark' ? 'light' : 'dark');
          });
        }

        // Mobile Menu Toggle
        const menuBtn = document.getElementById('menu-toggle');
        const navActions = document.getElementById('nav-actions');
        const menuIconUse = menuBtn.querySelector('use');
        let isMenuOpen = false;

        menuBtn.addEventListener('click', () => {
          isMenuOpen = !isMenuOpen;
          if (isMenuOpen) {
            navActions.classList.add('show');
            menuIconUse.setAttribute('href', '#icon-close');
          } else {
            navActions.classList.remove('show');
            menuIconUse.setAttribute('href', '#icon-menu');
          }
        });

        // Global Copy Behavior
        document.addEventListener('click', (e) => {
          const trigger = e.target.closest('[data-copy]');
          if (!trigger) return;
          const text = trigger.dataset.copy;
          if (!text) return;

          navigator.clipboard.writeText(text).then(() => {
            // Avoid double clicks
            if (trigger.dataset.copying) return;
            trigger.dataset.copying = 'true';

            const useTag = trigger.querySelector('use');
            const originalColor = trigger.style.color;
            
            if (useTag) {
              // Icon Mode: Swap href to check
              const originalHref = useTag.getAttribute('href');
              useTag.setAttribute('href', '#icon-check');
              trigger.style.color = 'var(--color-success)';
              
              setTimeout(() => {
                useTag.setAttribute('href', originalHref);
                trigger.style.color = originalColor;
                delete trigger.dataset.copying;
              }, 1500);
            } else {
              // Text Mode: Swap text
              const originalText = trigger.textContent;
              trigger.textContent = '{{ _("copy") }} ✓'; // Simple feedback
              trigger.style.color = 'var(--color-success)';
              
              setTimeout(() => {
                trigger.textContent = originalText;
                trigger.style.color = originalColor;
                delete trigger.dataset.copying;
              }, 1500);
            }
          }).catch(err => {
            console.error('Copy failed', err);
          });
        });
      })();
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
